name: Release Plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Metrics Analyzer
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VER="${TAG_NAME#v}"
          ./scripts/package-plugin.sh plugins/metrics-analyzer metrics-analyzer "${VER}"

      - name: Validate Index against Built Packages
        run: |
          python3 scripts/validate-index.py index.json || true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
